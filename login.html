<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Ruang Kelas - Al-Quran LMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="d-flex align-items-center min-vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                    <div class="deen-header rounded-0 text-center py-4">
                        <h4 class="fw-bold mb-1"><i class="bi bi-book-half me-2"></i>Login Ruang Kelas</h4>
                        <small class="opacity-75">Masuk sebagai Admin, Guru, atau Siswa</small>
                    </div>
                    <div class="card-body p-4">
                        <form id="formLogin">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Email Akun</label>
                                <input type="email" id="login_email" class="form-control" placeholder="admin@ngaji.com" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Password</label>
                                <input type="password" id="login_password" class="form-control" placeholder="123456" required>
                            </div>
                            <button type="submit" class="btn btn-emerald w-100 py-2 fw-bold">Masuk Kelas</button>
                        </form>
                        <hr>
                        <div class="d-flex justify-content-between small">
                            <a href="index.html" class="text-decoration-none text-secondary"><i class="bi bi-arrow-left"></i> Ke Beranda</a>
                            <a href="index.html" class="text-success fw-bold text-decoration-none">Daftar Siswa Baru</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase-config.js"></script>
    <script src="assets/js/auth.js"></script>
</body>
</html>
