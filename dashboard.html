<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruang Belajar & Dashboard - Al-Quran LMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="pb-mobile-nav">

    <!-- Topbar Desktop -->
    <nav class="navbar navbar-dark px-3 py-2 shadow-sm" style="background-color: var(--quran-dark);">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="index.html">
            <i class="bi bi-book-half text-warning"></i>
            <span>DeenConnect / Al-Quran LMS</span>
        </a>
        <div class="d-flex align-items-center gap-3 text-white">
            <span id="user-badge-top" class="small fw-semibold d-none d-sm-inline"></span>
            <button class="btn btn-sm btn-danger fw-bold rounded-pill px-3" onclick="logoutUser()">
                <i class="bi bi-power me-1"></i>Keluar
            </button>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row min-vh-100">
            <!-- Sidebar Desktop (Otomatis sembunyi di Mobile/Tablet) -->
            <div class="col-lg-2 bg-white border-end p-3 desktop-sidebar">
                <div class="nav flex-column nav-pills gap-1" id="desktop-sidebar-menu"></div>
            </div>

            <!-- Area Konten Utama -->
            <div class="col-12 col-lg-10 p-0 p-md-4" id="dashboard-main-content"></div>
        </div>
    </div>

    <!-- Bottom Navigation Mobile & Tablet (Persis Deen Connect image_792386.png) -->
    <div class="deen-bottom-nav" id="mobile-bottom-menu"></div>

    <!-- Modal Universal Form CRUD & Profil Tutor -->
    <div class="modal fade" id="modalDashboard" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content border-0 shadow-lg rounded-4">
                <div class="modal-header text-white" style="background: var(--deen-gradient);">
                    <h5 class="modal-title fw-bold" id="modalDashboardTitle">Form Data</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4" id="modalDashboardBody"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- ExcelJS untuk Import & Export Soal Excel Beserta Gambar di Dalam Sel -->
    <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase-config.js"></script>
    <script src="assets/js/dashboard.js"></script>
</body>
</html>
